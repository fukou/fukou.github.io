<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUKUO has moved</title>
  <link rel="canonical" href="https://fukuo.design">
  <meta http-equiv="refresh" content="3;url=https://fukuo.design">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #101114;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #e8e8ea;
      opacity: 1;
      transition: opacity 1.2s ease;
    }
    body.redirecting {
      opacity: 0;
    }
    main {
      text-align: center;
      padding: 0 1.5rem;
    }
    p {
      margin: 0 0 1.25rem;
      font-size: 1rem;
      line-height: 1.5;
    }
    a {
      color: #e8e8ea;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:focus-visible {
      outline: 2px solid #e8e8ea;
      outline-offset: 4px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      margin: 0 auto;
      border: 2px solid rgba(232, 232, 234, 0.25);
      border-top-color: #e8e8ea;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
      .spinner { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <main>
    <p>This site has moved to <a href="https://fukuo.design">fukuo.design</a>.</p>
    <div class="spinner" role="status" aria-label="Redirecting"></div>
  </main>
  <script>
    setTimeout(function () {
      document.body.classList.add("redirecting");
    }, 1800);
    setTimeout(function () {
      window.location.replace("https://fukuo.design");
    }, 3000);
  </script>
</body>
</html>
